
[project]
authors = [{ name = "Igor Passchier", email = "igor.passchier@gmail.com" }]
classifiers = [
  "License :: MIT ",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "flask",
  "matplotlib",
  "Pillow",
  "py3exiv2",
  "pydantic~=2.13",
  "python-dotenv",
  "requests",
  "sortedcontainers",
  "tinydb",
]
description = "Igors photo tagging library"
dynamic = ["version"]
license = { text = "MIT" }
name = "phototag"
requires-python = ">=3.14"

[project.urls]
#"Bug Tracker" = "https://Z003KBKV@dev.azure.com/Z003KBKV/Simulytic/_git/psimclient"
#Homepage = "https://Z003KBKV@dev.azure.com/Z003KBKV/Simulytic/_git/psimclient"

[project.scripts]
phototag = "phototag.cli:main"
exif = "phototag.exif:main"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=69",
  "setuptools_scm[toml]>=8.0", # "setuptools_scm_git_semver",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools_scm]
# local_scheme = "time-dot-node"
normalize = true
# version_scheme = "guess-next-rc"
fallback_version = "0.0.0"

[tool.setuptools.package-data]
phototag = ["py.typed"]

[project.optional-dependencies]
dev = [
  "black~=26.0",
  "build~=1.0",
  "isort~=8.0",
  "jupyter~=1.1",
  "nbqa~=1.9",
  "pytest_cov~=4.1",
  "pytest-mock~=3.14",
  "pytest~=7.2",
  "setuptools_scm[toml]~=8.0",
  "setuptools>=69",
  "sortedcontainers-stubs",
  "tox~=4.0",
  "twine~=4.0",
  "types-requests~=2.32",
]

testing = [
  "jupyter~=1.1",
  "nbqa~=1.9",
  "pydantic~=2.13",
  "pytest_cov~=4.1",
  "pytest-mock~=3.14",
  "pytest~=7.2",
  "sortedcontainers-stubs",
  "tox~=4.0",
]

linting = ["black~=26.0", "sortedcontainers-stubs", "types-requests~=2.32"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"
testpaths = ["test"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/__init__.py", "*/main.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ :",
]
show_missing = true
fail_under = 0

[tool.black]
line-length = 120

[tool.mypy]
exclude = 'venv|site-packages|.vscode|build|test'
ignore_missing_imports = true
plugins = ["tinydb.mypy_plugin"]

[tool.tox]
legacy_tox_ini = """
    [tox]
    min_version = 4.0
    env_list =
        py314
        black
        mypy

    [testenv]
    package = wheel
    commands = pytest -v test
    extras = testing
    allowlist_externals = pytest


    [testenv:black]
    extras = linting
    commands = black --check --diff src


    [testenv:mypy]
    extras = linting
    commands = mypy src
    allowlist_externals = mypy
"""
